services:
  postgres:
    image: postgres:16-alpine
    container_name: bytechain-currency-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-bytechain_currency_hub}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-bytechain_currency_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
